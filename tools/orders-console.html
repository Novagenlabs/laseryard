<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Laser Yard · Orders Console</title>
<!--
  Standalone local console for the Laser Yard orders API.
  Open this file directly in a browser (double-click / `open tools/orders-console.html`).
  It is NOT served by the website — it talks to the admin API over CORS
  with your ORDERS_ADMIN_KEY. Settings persist in this browser only.
-->
<style>
  :root {
    --ink: #17181d; --muted: #6f7076; --border: rgba(0,0,0,0.1);
    --gold: #eec335; --bg: #fdfdfd; --card: #ffffff; --red: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Poppins", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    padding: 48px 20px; min-height: 100vh;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 28px; }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 10px; font: inherit; font-size: 14px; background: var(--bg);
  }
  input:focus, select:focus { outline: 2px solid rgba(238,195,53,0.7); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid .full { grid-column: 1 / -1; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  button {
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    border-radius: 10px; padding: 10px 18px; border: 1px solid var(--border);
    background: var(--card); transition: transform 160ms cubic-bezier(0.23,1,0.32,1);
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button:disabled { opacity: 0.5; cursor: default; }
  .order {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .order .info { flex: 1; min-width: 220px; }
  .order .tn { font-weight: 600; font-size: 14px; }
  .order .item { font-size: 14px; }
  .order .meta { font-size: 12px; color: var(--muted); }
  .order select { width: auto; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .copy { border: none; background: none; padding: 2px 6px; color: var(--muted); font-size: 12px; }
  .copy:hover { color: var(--ink); }
  .error { color: var(--red); font-size: 14px; margin: 10px 0; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .settings-grid { display: grid; grid-template-columns: 2fr 3fr auto; gap: 10px; align-items: center; }
  @media (max-width: 620px) { .settings-grid { grid-template-columns: 1fr; } }
  .empty { color: var(--muted); font-size: 14px; padding: 24px 0; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
    border: 2px solid rgba(0,0,0,0.15); border-top-color: var(--ink);
    border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 7px;
  }
  button.primary .spinner { border-color: rgba(255,255,255,0.3); border-top-color: #fff; }
  .loadingRow { display: flex; align-items: center; color: var(--muted); font-size: 14px; padding: 20px 0; }
  .loadingRow .spinner { margin-right: 10px; }
  select:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <h1>Laser Yard · Orders Console</h1>
    <div style="display:flex; gap:8px;">
      <button id="refreshBtn" type="button">Refresh</button>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow">Connection</div>
    <form id="settingsForm" class="settings-grid">
      <input id="apiBase" placeholder="API base, e.g. https://laseryard.com" />
      <input id="apiKey" type="password" placeholder="ORDERS_ADMIN_KEY" />
      <button class="primary" type="submit">Connect</button>
    </form>
    <p class="hint">Stored in this browser only. Point the base at http://localhost:3000 while developing.</p>
  </div>

  <div id="error" class="error" hidden></div>

  <div class="card">
    <div class="eyebrow">New Order</div>
    <form id="createForm">
      <div class="grid">
        <input id="fName" placeholder="Customer name *" required />
        <input id="fPhone" placeholder="Phone (optional)" />
        <input id="fItem" class="full" placeholder="Item description *" required />
        <input id="fDest" placeholder="Destination (optional)" />
        <input id="fDesign" placeholder="Design URL (optional, or pick a file below)" />
        <input id="fFile" class="full" type="file" accept=".svg,.png,.jpg,.jpeg,.webp" />
      </div>
      <button class="primary" type="submit" style="margin-top:14px;">Create order</button>
      <p class="hint">The customer share link is copied to your clipboard on creation.</p>
    </form>
  </div>

  <div class="eyebrow">Orders</div>
  <div id="orders"><p class="empty">Connect to load orders.</p></div>
</div>

<script>
  const STATUSES = ["received","processing","in_production","quality_check","approved","shipped","delivered","cancelled"];
  const $ = (id) => document.getElementById(id);
  const store = {
    get base() { return localStorage.getItem("ly-api-base") || "https://laseryard.com"; },
    set base(v) { localStorage.setItem("ly-api-base", v); },
    get key() { return localStorage.getItem("ly-api-key") || ""; },
    set key(v) { localStorage.setItem("ly-api-key", v); },
  };

  function setBusy(btn, on, busyLabel) {
    if (on) {
      btn.dataset.label = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>' + (busyLabel || btn.dataset.label);
    } else {
      btn.disabled = false;
      btn.textContent = btn.dataset.label;
    }
  }

  function showError(msg) {
    const el = $("error");
    el.textContent = msg || "";
    el.hidden = !msg;
  }

  async function api(path, opts = {}) {
    const res = await fetch(store.base.replace(/\/$/, "") + path, {
      ...opts,
      headers: {
        "Authorization": "Bearer " + store.key,
        ...(opts.body ? { "Content-Type": "application/json" } : {}),
        ...(opts.headers || {}),
      },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  // Artwork displays on a ~360px card, so anything huge is wasted bytes.
  // Small SVGs stay vector; big SVGs and big rasters get rendered to a
  // 1440px-wide WebP before upload.
  const KEEP_SVG_UNDER = 1.5 * 1024 * 1024;
  const KEEP_RASTER_UNDER = 500 * 1024;
  const TARGET_WIDTH = 1440;

  async function prepareArtwork(file) {
    const isSvg = file.type === "image/svg+xml";
    if (isSvg && file.size <= KEEP_SVG_UNDER) return file;
    if (!isSvg && file.size <= KEEP_RASTER_UNDER) return file;

    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = () => rej(new Error("Could not read that image"));
        i.src = url;
      });
      const w0 = img.naturalWidth || img.width;
      const h0 = img.naturalHeight || img.height;
      if (!w0 || !h0) throw new Error("Could not read the image dimensions");
      const scale = Math.min(1, TARGET_WIDTH / w0);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(w0 * scale);
      canvas.height = Math.round(h0 * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((r) => canvas.toBlob(r, "image/webp", 0.85));
      if (!blob) throw new Error("Compression failed");
      return new File([blob], file.name.replace(/\.\w+$/, "") + ".webp", { type: "image/webp" });
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  async function uploadDesign(rawFile) {
    const file = await prepareArtwork(rawFile);
    const fd = new FormData();
    fd.append("file", file);
    const res = await fetch(store.base.replace(/\/$/, "") + "/api/designs", {
      method: "POST",
      headers: { "Authorization": "Bearer " + store.key },
      body: fd,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Upload failed");
    return data.url;
  }

  function shareLink(tn) {
    return store.base.replace(/\/$/, "") + "/track?order=" + encodeURIComponent(tn);
  }

  function copyLink(tn, btn) {
    navigator.clipboard.writeText(shareLink(tn)).then(() => {
      const prev = btn.textContent;
      btn.textContent = "copied";
      setTimeout(() => (btn.textContent = prev), 1600);
    });
  }

  function renderOrders(orders) {
    const box = $("orders");
    box.innerHTML = "";
    if (!orders.length) {
      box.innerHTML = '<p class="empty">No orders yet.</p>';
      return;
    }
    for (const o of orders) {
      const div = document.createElement("div");
      div.className = "order";

      const info = document.createElement("div");
      info.className = "info";
      const tnRow = document.createElement("div");
      const tn = document.createElement("span");
      tn.className = "tn mono";
      tn.textContent = o.trackingNumber;
      const copy = document.createElement("button");
      copy.type = "button";
      copy.className = "copy mono";
      copy.textContent = "copy link";
      copy.onclick = () => copyLink(o.trackingNumber, copy);
      tnRow.append(tn, copy);
      const item = document.createElement("div");
      item.className = "item";
      item.textContent = o.itemDescription;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [o.customerName, o.destination, o.customerPhone].filter(Boolean).join(" · ");
      info.append(tnRow, item, meta);

      const sel = document.createElement("select");
      sel.className = "mono";
      for (const s of STATUSES) {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s.replaceAll("_", " ");
        if (s === o.status) opt.selected = true;
        sel.append(opt);
      }
      sel.onchange = async () => {
        showError("");
        sel.disabled = true;
        try {
          await api("/api/orders/" + encodeURIComponent(o.trackingNumber), {
            method: "PATCH",
            body: JSON.stringify({ status: sel.value }),
          });
        } catch (e) {
          showError(e.message);
        }
        await load();
      };

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.textContent = "Edit";
      editBtn.onclick = () => {
        const open = div.querySelector(".editForm");
        if (open) { open.remove(); return; }
        div.append(buildEditForm(o));
      };

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.textContent = "Delete";
      delBtn.style.color = "var(--red)";
      delBtn.onclick = async () => {
        if (!confirm("Delete " + o.trackingNumber + " (" + o.customerName + ")? The customer's tracking link will stop working.")) return;
        showError("");
        setBusy(delBtn, true, "Deleting…");
        try {
          await api("/api/orders/" + encodeURIComponent(o.trackingNumber), { method: "DELETE" });
        } catch (e) {
          showError(e.message);
          setBusy(delBtn, false);
        }
        await load();
      };

      div.append(info, sel, editBtn, delBtn);
      box.append(div);
    }
  }

  function buildEditForm(o) {
    const form = document.createElement("form");
    form.className = "editForm";
    form.style.cssText = "flex-basis:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:10px;border-top:1px solid var(--border);margin-top:6px;";
    const mk = (ph, val) => {
      const i = document.createElement("input");
      i.placeholder = ph;
      i.value = val || "";
      return i;
    };
    const eName = mk("Customer name", o.customerName);
    const ePhone = mk("Phone", o.customerPhone);
    const eItem = mk("Item description", o.itemDescription);
    const eDest = mk("Destination", o.destination);
    const eDesign = mk("Design URL (clear to remove)", o.designUrl);
    const eFile = document.createElement("input");
    eFile.type = "file";
    eFile.accept = ".svg,.png,.jpg,.jpeg,.webp";
    eItem.style.gridColumn = "1 / -1";
    eFile.style.gridColumn = "1 / -1";
    const save = document.createElement("button");
    save.className = "primary";
    save.type = "submit";
    save.textContent = "Save changes";
    save.style.gridColumn = "1 / -1";
    save.style.justifySelf = "start";
    form.append(eName, ePhone, eItem, eDest, eDesign, eFile, save);
    form.onsubmit = async (e) => {
      e.preventDefault();
      showError("");
      setBusy(save, true, eFile.files[0] ? "Uploading design…" : "Saving…");
      try {
        let designUrl = eDesign.value.trim();
        if (eFile.files[0]) {
          designUrl = await uploadDesign(eFile.files[0]);
          setBusy(save, false);
          setBusy(save, true, "Saving…");
        }
        await api("/api/orders/" + encodeURIComponent(o.trackingNumber), {
          method: "PATCH",
          body: JSON.stringify({
            customerName: eName.value.trim(),
            customerPhone: ePhone.value.trim(),
            itemDescription: eItem.value.trim(),
            destination: eDest.value.trim(),
            designUrl,
          }),
        });
        await load();
      } catch (err) {
        showError(err.message);
        setBusy(save, false);
      }
    };
    return form;
  }

  async function load() {
    if (!store.key) return;
    showError("");
    if (!$("orders").querySelector(".order")) {
      $("orders").innerHTML = '<div class="loadingRow"><span class="spinner"></span>Loading orders…</div>';
    }
    try {
      const data = await api("/api/orders");
      renderOrders(data.orders);
    } catch (e) {
      $("orders").innerHTML = '<p class="empty">Could not load orders.</p>';
      showError(e.message === "Unauthorized" ? "That API key was rejected." : e.message);
    }
  }

  $("settingsForm").onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    if ($("apiBase").value.trim()) store.base = $("apiBase").value.trim();
    if ($("apiKey").value.trim()) store.key = $("apiKey").value.trim();
    $("apiKey").value = "";
    setBusy(btn, true, "Connecting…");
    await load();
    setBusy(btn, false);
  };

  $("createForm").onsubmit = async (e) => {
    e.preventDefault();
    showError("");
    const btn = e.target.querySelector("button.primary");
    const file = $("fFile").files[0];
    setBusy(btn, true, file ? "Uploading design…" : "Creating…");
    try {
      let designUrl = $("fDesign").value.trim() || undefined;
      if (file) {
        designUrl = await uploadDesign(file);
        setBusy(btn, false);
        setBusy(btn, true, "Creating…");
      }
      const data = await api("/api/orders", {
        method: "POST",
        body: JSON.stringify({
          customerName: $("fName").value.trim(),
          itemDescription: $("fItem").value.trim(),
          customerPhone: $("fPhone").value.trim() || undefined,
          destination: $("fDest").value.trim() || undefined,
          designUrl,
        }),
      });
      $("createForm").reset();
      copyLink(data.order.trackingNumber, document.createElement("button"));
      await load();
    } catch (err) {
      showError(err.message);
    } finally {
      setBusy(btn, false);
    }
  };

  $("refreshBtn").onclick = async () => {
    setBusy($("refreshBtn"), true, "Refreshing…");
    await load();
    setBusy($("refreshBtn"), false);
  };
  $("apiBase").value = store.base;
  load();
</script>
</body>
</html>
